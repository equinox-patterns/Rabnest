name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à construire'
        type: choice
        default: all
        options: [all, macos, windows, linux]

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple-Silicon
          - arch: x86_64
            label: Intel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ../Trame

      - name: Configurer
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Compiler
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Traductions Qt dans le catalogue
        run: |
          "$QT_ROOT_DIR/bin/lconvert" -i build/rabnest_fr_FR.qm -o /tmp/rabnest_fr.ts
          grep -q "<source>&amp;Cancel</source>" /tmp/rabnest_fr.ts \
            || { echo "Traductions Qt absentes : les dialogues natifs resteraient en anglais"; exit 1; }

      - name: Empaqueter
        run: |
          cmake --install build --prefix stage
          mkdir -p dmg
          cp -R stage/Rabnest.app dmg/
          ln -s /Applications dmg/Applications
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil create -volname Rabnest -srcfolder dmg -ov -format UDZO \
            "Rabnest-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: '*.dmg'

  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ..\Trame

      - name: zlib
        run: vcpkg install zlib:x64-windows

      - name: Configurer
        run: >-
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Traductions Qt dans le catalogue
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\lconvert.exe" -i build\rabnest_fr_FR.qm -o check_fr.ts
          if (-not (Select-String -Path check_fr.ts -Pattern "<source>&amp;Cancel</source>" -Quiet)) {
            throw "Traductions Qt absentes : les dialogues natifs resteraient en anglais"
          }

      - name: Empaqueter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\Rabnest.exe dist\
          Copy-Item build\Release\*.dll dist\
          Copy-Item NOTICE, AUTHORS.txt, LICENSE dist\
          New-Item -ItemType Directory -Force dist\licenses | Out-Null
          Copy-Item share\licenses\*.txt dist\licenses\
          windeployqt --release --no-translations --compiler-runtime dist\Rabnest.exe
          # windeployqt ne trouve pas le CRT hors invite de commandes VS (VCINSTALLDIR vide),
          # il saute --compiler-runtime sans rien dire. On copie le redistribuable à la main.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          # Le dossier VC\Redist\MSVC contient plusieurs générations (14.29 = VS2019,
          # 14.30 et au-delà = VS2022) et Get-ChildItem les rend dans l'ordre
          # alphabétique : « -First 1 » prenait donc la PLUS ANCIENNE, alors que le code
          # est compilé avec le CRT de VS2022. Rabnest ne le manifestait pas — il
          # n'appelle jamais Xerces — mais le défaut était le même que dans Ostara,
          # où il tuait l'application au démarrage sur tout Windows (0xC0000005).
          # FileVersion arrive sous la forme « 14.29.30157.0 built by: cloudtest » :
          # seul le premier mot est convertible en [version], le reste fait échouer le
          # tri. On isole donc le numéro avant de comparer.
          #
          # Le chemin est ancré sur « <version>\x64\Microsoft.VC14x.CRT\ » : à côté du
          # CRT du bureau, le redistribuable contient aussi « onecore\x64\… » (sous-
          # ensemble d'API OneCore) et « spectre\x64\… » (bibliothèques atténuées pour
          # /Qspectre). Un simple « \x64\ » les attrapait tous les deux.
          $crtCandidates = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Recurse -Filter vcruntime140.dll |
            Where-Object { $_.FullName -match '\\MSVC\\[0-9][0-9.]*\\x64\\Microsoft\.VC14[0-9]\.CRT\\' }
          if (-not $crtCandidates) {
            # Repli : n'importe quel x64, sauf les deux variantes ci-dessus.
            $crtCandidates = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Recurse -Filter vcruntime140.dll |
              Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch '\\(onecore|spectre)\\' }
          }
          $crtDll = $crtCandidates |
            Sort-Object { [version](($_.VersionInfo.FileVersion -split ' ')[0]) } -Descending |
            Select-Object -First 1
          if (-not $crtDll) { throw "CRT x64 introuvable dans le redistribuable Visual Studio" }
          Copy-Item (Join-Path $crtDll.Directory.FullName "*.dll") dist\
          if (-not (Test-Path dist\vcruntime140.dll)) { throw "CRT MSVC absent de dist" }
          $crtVersion = [version]((Get-Item dist\vcruntime140.dll).VersionInfo.FileVersion -split ' ')[0]
          if ($crtVersion -lt [version]'14.30') {
            throw "CRT trop ancien dans dist : $crtVersion (VS2019 = 14.29, VS2022 = 14.30+)"
          }
          choco install nsis -y --no-progress
          $version = "$env:GITHUB_REF_NAME" -replace '^v',''
          & "C:\Program Files (x86)\NSIS\makensis.exe" "-DVERSION=$version" "-DDIST=$PWD\dist" "-DOUTDIR=$PWD" packaging\windows\installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: '*.exe'

  linux:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          cache: true

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev librsvg2-bin

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ../Trame

      - name: Configurer
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        run: cmake --build build --parallel "$(nproc)"

      - name: Traductions Qt dans le catalogue
        run: |
          "$QT_ROOT_DIR/bin/lconvert" -i build/rabnest_fr_FR.qm -o /tmp/rabnest_fr.ts
          grep -q "<source>&amp;Cancel</source>" /tmp/rabnest_fr.ts \
            || { echo "Traductions Qt absentes : les dialogues natifs resteraient en anglais"; exit 1; }

      - name: AppImage
        run: |
          mkdir -p AppDir
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          rsvg-convert -w 512 -h 512 share/icons/app/rabnest.svg -o rabnest.png
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD:$PATH"
          ./linuxdeploy --appdir AppDir -e AppDir/usr/bin/Rabnest \
            -d share/rabnest.desktop -i rabnest.png --plugin qt
          # libgnutls est embarqué mais pas ses propres dépendances : sans elles
          # l'AppImage ne démarre pas sur une distribution minimale.
          for lib in libgmp.so.10 libgpg-error.so.0 libcom_err.so.2; do
            cp -L /usr/lib/x86_64-linux-gnu/${lib}* AppDir/usr/lib/ 2>/dev/null || true
          done
          # appimagetool veut l'icône à la racine de l'AppDir, nommée comme Icon= du .desktop
          cp -f rabnest.png AppDir/rabnest.png
          ARCH=x86_64 ./appimagetool AppDir "Rabnest.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: '*.AppImage'
