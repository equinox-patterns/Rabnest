name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - name: Trame
        run: git clone --depth 1 --branch v0.1.0 https://github.com/equinox-patterns/Trame.git ../Trame

      - name: Configurer
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Compiler
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Empaqueter
        run: |
          cmake --install build --prefix stage
          mkdir -p dmg
          cp -R stage/Rabnest.app dmg/
          ln -s /Applications dmg/Applications
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil create -volname Rabnest -srcfolder dmg -ov -format UDZO \
            "Rabnest-${VERSION}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: '*.dmg'
